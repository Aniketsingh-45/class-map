services:
  - type: web
    name: class-map
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: STT_PROVIDER
        value: sarvam
      - key: USE_CLAUDE
        value: "1"
      - key: DEMO_PIN
        value: "1234"
      - key: AUTO_SEED
        value: "1"
      - key: SECRET_KEY
        generateValue: true
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: SARVAM_API_KEY
        sync: false
